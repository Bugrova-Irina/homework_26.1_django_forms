{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            {% if not perms.catalog.can_unpublish_product and object.owner != user %}
            <div class="alert alert-danger">
                У вас нет прав для удаления этого продукта
            </div>
            {% endif %}
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Действительно хотите удалить товар "{{ product.name }}"?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                </div>
                <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
                    Удалить
                </button>
                <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'catalog:home' %}" role="button">Отменить</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
